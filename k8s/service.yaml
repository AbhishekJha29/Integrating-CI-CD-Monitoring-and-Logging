# Kubernetes Service providing internal load balancing across demo-api pods
# Note: Since type is ClusterIP (internal to the cluster), you can reach it locally using:
# kubectl port-forward -n demo svc/demo-api 8080:80
apiVersion: v1
kind: Service
metadata:
  # Name of the service matching deployment
  name: demo-api
  # Service placed inside the demo namespace
  namespace: demo
  labels:
    app: demo-api
spec:
  # ClusterIP exposes the service on an internal IP within the cluster only
  type: ClusterIP
  selector:
    # Routes incoming traffic to pods with label app: demo-api
    app: demo-api
  ports:
    - name: http
      # Port exposed by the Service within the cluster
      port: 80
      # Target port on the container where the application listens
      targetPort: 3000
