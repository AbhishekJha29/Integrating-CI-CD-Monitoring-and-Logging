# Kubernetes Deployment managing pod replicas of the demo application
apiVersion: apps/v1
kind: Deployment
metadata:
  # Deployment resource name
  name: demo-api
  # Target namespace created for the demo application
  namespace: demo
  labels:
    app: demo-api
spec:
  # Run 2 pod replicas for redundancy and high availability
  replicas: 2
  selector:
    matchLabels:
      app: demo-api
  template:
    metadata:
      labels:
        app: demo-api
      annotations:
        # Prometheus scraping annotations (used in the monitoring phase to auto-discover scrape targets)
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: demo-api
          # Container image hosted on GHCR
          # Note: CI pipeline will automatically replace this tag (:latest) with the git commit SHA on push to main
          image: ghcr.io/abhishekjha29/integrating-ci-cd-monitoring-and-logging:latest
          ports:
            # Container listening port exposed by the Express server
            - containerPort: 3000
          env:
            # Environment variable setting application listening port
            - name: PORT
              value: "3000"
          # Liveness probe to restart the container if the process becomes unresponsive
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          # Readiness probe to ensure the container only receives traffic when healthy
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 5
          # Resource requests (guaranteed allocation) and limits (hard upper bounds)
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
