# Argo CD Application definition managing declarative GitOps deployment of demo-api
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Name of the Argo CD application
  name: demo-api
  # Argo CD control plane namespace where application resources are tracked
  namespace: argocd
spec:
  # Reference to project in Argo CD (default project permits cluster-wide deployments)
  project: default
  # Source repository configuration containing our Kubernetes manifests
  source:
    # Git repository URL for the project
    repoURL: https://github.com/AbhishekJha29/Integrating-CI-CD-Monitoring-and-Logging.git
    # Git branch to track
    targetRevision: main
    # Directory path inside repository containing Kubernetes YAML manifests
    path: k8s
  # Target destination cluster and namespace for deploying manifests
  destination:
    # In-cluster Kubernetes API server
    server: https://kubernetes.default.svc
    # Namespace to deploy the manifests into
    namespace: demo
  # Automated synchronization policy
  syncPolicy:
    automated:
      # Prune enables automatic deletion of cluster resources when their manifests are removed from Git
      prune: true
      # selfHeal automatically overwrites manual cluster drifts to maintain Git as single source of truth
      selfHeal: true
    syncOptions:
      # Automatically create the destination namespace if it does not already exist
      - CreateNamespace=true
