name: CI

# Triggers for pull requests to any branch and pushes to the main branch
on:
  pull_request:
  push:
    branches:
      - main
    # Ignore changes to k8s manifests, Argo CD configs, and documentation on push.
    # This stops the bot's manifest-updating commit from starting an endless CI loop.
    paths-ignore:
      - 'k8s/**'
      - 'argocd/**'
      - '**.md'

# Top-level permissions: read code and write container images to GHCR
permissions:
  contents: read
  packages: write

jobs:
  # Job 1: Runs automated tests to ensure code quality before building artifacts
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      # Check out repository code for testing
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Node.js 20 environment with npm cache optimization
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Deterministic dependency installation from package-lock.json
      - name: Install dependencies
        run: npm ci

      # Execute automated tests using Node's built-in test runner
      - name: Run test suite
        run: npm test

  # Job 2: Builds Docker image, scans for vulnerabilities, and publishes to GHCR on main branch
  build-and-scan:
    name: Build, Scan & Publish
    needs: test
    runs-on: ubuntu-latest
    steps:
      # Check out repository code for container build
      - name: Checkout code
        uses: actions/checkout@v4

      # Compute lowercase image name because Docker/OCI requires lowercase repository names
      - name: Compute lowercase image name
        # GitHub repository names can contain uppercase letters, but container image names must be lowercase
        run: |
          echo "IMAGE_NAME=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Set up Docker Buildx for enhanced container build features and caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build image locally without pushing so it can be loaded into the Docker daemon for vulnerability scanning
      - name: Build image locally for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Scan the locally built image with Trivy to catch critical vulnerabilities
      # Check https://github.com/aquasecurity/trivy-action/releases for the latest stable release tag
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      # Authenticate with GitHub Container Registry using the ephemeral GITHUB_TOKEN
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push the image to GHCR tagged with commit SHA and latest
      - name: Build and push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      # Verify that the image was actually published and is inspectable in the remote registry
      - name: Verify image exists in registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools inspect "${IMAGE_NAME}:${{ github.sha }}"

      # Publish the image reference and Packages tab link to the GitHub Actions job summary
      - name: Write image details to job summary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "### Image Published Successfully :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image (SHA):** \`${IMAGE_NAME}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image (latest):** \`${IMAGE_NAME}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Packages Registry:** https://github.com/${{ github.repository_owner }}?tab=packages" >> $GITHUB_STEP_SUMMARY

  # Job 3: Updates k8s/deployment.yaml with the newly published image SHA and pushes back to Git
  # NOTE: If the main branch has branch protection rules blocking bot pushes or requiring PRs,
  # this job will fail unless the branch protection rule allows github-actions[bot] to push.
  update-manifest:
    name: Update Deployment Manifest
    needs: build-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Check out repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Compute lowercase image name to match image specification in k8s/deployment.yaml
      - name: Compute lowercase image name
        run: |
          echo "IMAGE_NAME=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Update the image tag in k8s/deployment.yaml with full commit SHA
      - name: Update image tag in deployment manifest
        run: |
          sed -i "s|image: ${IMAGE_NAME}:.*|image: ${IMAGE_NAME}:${{ github.sha }}|g" k8s/deployment.yaml

      # Commit and push manifest change using github-actions[bot] if modifications were made
      - name: Commit and push updated manifest
        run: |
          if git diff --quiet k8s/deployment.yaml; then
            echo "No change in manifest tag. Skipping commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git pull --rebase origin main
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          git commit -m "chore: deploy ${SHORT_SHA} [skip ci]"
          git push origin main
