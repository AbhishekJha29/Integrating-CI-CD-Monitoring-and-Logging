name: CI

# Trigger workflow on pull requests to any branch and on direct push to main
on:
  pull_request:
  push:
    branches:
      - main

# Top-level permissions: read repo contents and allow writing packages to GHCR
permissions:
  contents: read
  packages: write

jobs:
  # Job 1: Run unit/integration tests
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      # Check out repository source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Node.js 20 environment with npm cache enabled for faster runs
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Install exact dependencies from package-lock.json
      - name: Install dependencies
        run: npm ci

      # Run automated tests using Node built-in test runner
      - name: Run tests
        run: npm test

  # Job 2: Build container image, scan for vulnerabilities, and publish to GHCR on main
  build-and-scan:
    name: Build, Scan and Publish
    needs: test
    runs-on: ubuntu-latest
    steps:
      # Check out repository source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Compute lowercased image name because GHCR requires all-lowercase repository paths
      - name: Compute lowercase image name
        run: |
          echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Set up Docker Buildx for enhanced builder features
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the Docker image locally (load into Docker daemon) without pushing
      - name: Build Docker image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Scan the local image using Trivy, failing only on fixable CRITICAL vulnerabilities
      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      # Log in to GitHub Container Registry only when pushing to main
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push image to GHCR with commit SHA and latest tags only when pushing to main
      - name: Push Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
